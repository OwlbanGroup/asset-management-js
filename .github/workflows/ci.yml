name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run ESLint
        run: bun run lint

      - name: Build MCP server
        run: bun run build:mcp

      - name: Build SDK distribution
        run: bun run tshy

      - name: Verify build outputs
        run: |
          ls -la dist/
          ls -la bin/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build SDK
        run: bun run build

      - name: Run tests
        run: bun test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cloudinary-asset-management-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker build
        run: docker run --rm cloudinary-asset-management-mcp:test --version || true
